name: Deploy Core Service to ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3️⃣ Setup Terraform (ONLY to read outputs)
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      # 4️⃣ Download Terraform state from S3
      - name: Download Terraform state
        run: |
          aws s3 cp s3://${{ secrets.TF_STATE_BUCKET }}/${{ secrets.TF_STATE_KEY }} terraform.tfstate

      # 5️⃣ Read Terraform outputs
      - name: Read Terraform outputs
        run: |
          echo "ECR_REPO=$(terraform output -state=terraform.tfstate -raw ecr_repository_url | tr -d '\n')" >> $GITHUB_ENV
          echo "ECS_CLUSTER=$(terraform output -state=terraform.tfstate -raw ecs_cluster_name | tr -d '\n')" >> $GITHUB_ENV
          echo "ECS_SERVICE=$(terraform output -state=terraform.tfstate -raw ecs_service_name | tr -d '\n')" >> $GITHUB_ENV

      # 6️⃣ Debug (safe to remove later)
      - name: Debug resolved values
        run: |
          echo "ECR_REPO=${ECR_REPO}"
          echo "ECS_CLUSTER=${ECS_CLUSTER}"
          echo "ECS_SERVICE=${ECS_SERVICE}"
          echo "IMAGE=${ECR_REPO}:latest"

      # 7️⃣ Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 8️⃣ Build & push Docker image (ALWAYS latest)
      - name: Build and push Docker image
        run: |
          docker build -t core-service:latest .
          docker tag core-service:latest ${ECR_REPO}:latest
          docker push ${ECR_REPO}:latest

      # 9️⃣ Render ECS task definition (latest image)
      - name: Render ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definitions/core-service.json
          container-name: core-service
          image: "${{ env.ECR_REPO }}:latest"

      # 🔟 Deploy new task definition to ECS
      - name: Deploy ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
